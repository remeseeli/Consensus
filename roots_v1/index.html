<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wiki Mind Map</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #fafafa; }
    form { display: flex; gap: 8px; margin-bottom: 12px; }
    input { flex: 1; padding: 8px; font-size: 16px; }
    button { padding: 8px 14px; font-size: 16px; cursor: pointer; }
    #map svg { width: 100%; height: auto; max-height: 70vh; background: #fff; border: 1px solid #ddd; border-radius: 8px; }
    .node { cursor: pointer; }
    .node text { font-size: 12px; fill: #222; }
    .node:hover text { fill: #0645ad; text-decoration: underline; }
    #status { color: #666; min-height: 20px; margin: 8px 0; }
    #answer { background: #fff; padding: 12px; border: 1px solid #ddd; border-radius: 8px; line-height: 1.5; }
  </style>
</head>
<body>
  <h2>Wiki Mind Map</h2>

  <form id="searchForm">
    <input id="query" placeholder="Enter a topic or ask a question" required>
    <button>Go</button>
  </form>

  <div id="status"></div>
  <div id="map"></div>
  <div id="answer"></div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
